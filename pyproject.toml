[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-hairline"
version = "0.1.0"
description = "Hairline's twenty-seven isometric line figures that answer the pointer, as Reflex components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "hairline",
    "isometric",
    "svg",
    "illustration",
    "empty-state",
    "interactive",
]

dependencies = ["reflex>=0.9.12"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-hairline"
Source = "https://github.com/ecrespo/reflex-hairline"
Issues = "https://github.com/ecrespo/reflex-hairline/issues"
"Hairline (upstream)" = "https://hairline.lucasmarkes.com"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[dependency-groups]
dev = ["build", "twine", "pytest"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_hairline = ["*.js", "*.pyi", "LICENSE.hairline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["_to_delete", "*.pyi", ".web", "hairline_demo/.web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "S", "PLR0124"]
ignore = [
    "RUF012",  # Reflex state vars and component fields use mutable class defaults by design
    "RUF001", "RUF003",  # "×" in captions is intentional
    "E501",    # long docstrings / tables; the formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"custom_components/reflex_hairline/__init__.py" = ["F401", "F403"]
"tests/**" = ["S101"]
"custom_components/reflex_hairline/hairline.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["reflex_hairline", "hairline_demo"]

[tool.bandit]
exclude_dirs = ["tests", "_to_delete", ".venv", "hairline_demo/.web"]
skips = ["B101"]  # the import-time catalogue/classes consistency assert is intentional
