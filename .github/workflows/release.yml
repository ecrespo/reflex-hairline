name: Release

# Push a tag `vX.Y.Z` that matches `version` in pyproject.toml.
#   * Every release is first pre-published to TestPyPI and installed back from it.
#   * Final versions (X.Y.Z) then go to PyPI and get a GitHub Release.
#   * Pre-releases (X.Y.ZrcN, aN, bN, .devN) stop after TestPyPI and get a GitHub pre-release.
# `workflow_dispatch` runs the TestPyPI pre-publication only (no PyPI, no GitHub Release).
# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored in the repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read version and check it against the tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version v$version"; exit 1
          fi
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then pre=true; else pre=false; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease=$pre)"

  quality:
    name: Code quality
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

  build:
    name: Build distribution
    needs: [meta, quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  testpypi:
    name: Pre-publish to TestPyPI
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/reflex-hairline/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Install from TestPyPI
    needs: [meta, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the pre-published version and import it
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          uv venv /tmp/env
          for _ in 1 2 3 4 5 6; do
            uv pip install --python /tmp/env --no-cache \
              --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              "reflex-hairline==${VERSION}" && break
            echo "not on the index yet, retrying in 20s"; sleep 20
          done
          /tmp/env/bin/python -c "import reflex_hairline as rh; assert len(rh.FIGURES) == 27; print('ok', rh.HAIRLINE_NPM)"

  pypi:
    name: Publish to PyPI
    needs: [meta, verify-testpypi]
    if: github.ref_type == 'tag' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-hairline/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: [meta, verify-testpypi, pypi]
    if: always() && github.ref_type == 'tag' && needs.verify-testpypi.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
